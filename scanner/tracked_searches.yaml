# Card Clurb — tracked searches (niche: Pokémon TCG)
#
# Each entry: one eBay Browse API `q` search per scan run.
#   name:         stable id, also the key into the market-price reference
#   query:        the actual eBay search string
#   category:     graded_singles | raw_singles | sealed | misspell
#   priority:     1 (scan every run) | 2 (scan on alternating runs)
#   market_usd:   hand-set anchor; used until the search has enough
#                 eBay-observed sales, then the observed median takes over.
#   record_sales: false for misspell searches — their sold prices ARE the
#                 deal prices (biased low), so they're never used as the
#                 market reference. Default true.
#
# Market prices come from our own eBay observations only (sales_ledger.py):
# auctions with bids that disappear => confirmed eBay sales. No third-party
# price sites. A search with no confirmed sales for a long while while we
# keep watching its listings is treated as DEAD and skipped that run.
#
# Misspell variants exist because mislisted auctions get fewer bids and
# close cheap — a classic, durable edge for deal scanners.

searches:
