name: Card Clurb Scan

on:
  schedule:
    # Every 4 hours (UTC). Hours 04/12/20 run light scans, the rest run full.
    - cron: '5 */4 * * *'
  workflow_dispatch: # lets you trigger a run manually from the Actions tab

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pyyaml

      - name: Check eBay secrets
        run: |
          if [ -z "${{ secrets.EBAY_CLIENT_ID }}" ] || [ -z "${{ secrets.EBAY_CLIENT_SECRET }}" ]; then
            echo "::error::EBAY_CLIENT_ID and/or EBAY_CLIENT_SECRET are missing. Add them under repo Settings -> Secrets and variables -> Actions -> Repository secrets, then re-run."
            exit 1
          fi
          echo "eBay secrets present."

      - name: Run scanner
        env:
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
        run: |
          HOUR=$(date -u +%H)
          if [ "$HOUR" = "04" ] || [ "$HOUR" = "12" ] || [ "$HOUR" = "20" ]; then
            echo "Light scan (priority-1 searches)"
            python3 scanner/run_scan.py --priority 1
          else
            echo "Full scan (all searches)"
            python3 scanner/run_scan.py
          fi

      - name: Publish fresh deals
        run: |
          MODE=$(python3 -c "import json; print(json.load(open('site/deals.json'))['mock_mode'])")
          if [ "$MODE" = "True" ]; then
            echo "::error::Scanner ran in mock mode (no live eBay data). Refusing to publish sample deals to the public site."
            exit 1
          fi
          cp site/deals.json deals.json
          git config user.name "cardclurb-bot"
          git config user.email "cardclurb-bot@localhost"
          git add deals.json
          git diff --cached --quiet || git commit -m "refresh deals feed"
          git push
